<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>现病史训练 · 更新服务</title>
<style>
  body{margin:0;background:#f3f6f8;color:#132430;font:15px/1.7 -apple-system,"Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{max-width:560px;width:100%;background:#fff;border:1px solid #e1e9ef;border-radius:16px;
    box-shadow:0 20px 50px -30px rgba(19,36,48,.5);padding:30px 32px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#15803d;margin-right:7px;
    box-shadow:0 0 0 4px rgba(21,128,61,.14)}
  h1{font-size:20px;margin:0 0 6px;font-weight:700}
  .sub{color:#7b8fa1;font-size:13px;margin-bottom:20px}
  code{background:#f1f5f8;padding:2px 6px;border-radius:5px;font-size:12.5px}
  .tip{margin-top:18px;padding:12px 14px;background:#e7f3f0;border-radius:9px;font-size:12.5px;color:#095c53;line-height:1.8}
</style>
</head>
<body>
  <div class="box">
    <h1><span class="dot"></span>更新服务运行中</h1>
    <div class="sub">现病史采集训练系统 · 版本 v2.0.2 · 题库 2026.11.11（34 题）</div>
    <div class="tip">
      把这个地址填到软件的「检查版本 → 修改」里：<br>
      <code id="addr"></code>
    </div>
  </div>
  <script>document.getElementById('addr').textContent = location.origin + '/';</script>
</body>
</html>
